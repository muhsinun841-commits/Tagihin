name: Build TAGIHIN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Show versions
      - name: Show Flutter version
        run: |
          flutter --version
          java -version
          flutter doctor -v

      # 5. Check project files
      - name: Check project files
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart tidak ditemukan."
            exit 1
          }

      # 6. Ensure Android platform exists
      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --org com.tagihin.app
          fi

          test -f android/app/src/main/AndroidManifest.xml

      # 7. Install Android SDK 36
      - name: Install Android SDK 36
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 8. Set app label
      - name: Set Android app label
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="TAGIHIN"/' "$MANIFEST"

      # 9. Configure compileSdk
      - name: Configure Android compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle = next((p for p in candidates if p.is_file()), None)

          if gradle is None:
              raise SystemExit(
                  "ERROR: android/app/build.gradle atau "
                  "build.gradle.kts tidak ditemukan."
              )

          text = gradle.read_text()

          patterns = [
              r'(?m)^(\s*compileSdkVersion\s+)34(\s*(?://.*)?$)',
              r'(?m)^(\s*compileSdk\s+)34(\s*(?://.*)?$)',
          ]

          updated = text
          for pattern in patterns:
              updated = re.sub(pattern, r'\g<1>36\g<2>', updated)

          if updated != text:
              gradle.write_text(updated)
              print(f"compileSdk diperbarui menjadi 36 di {gradle}")
          else:
              print(f"Tidak ada compileSdk 34 literal yang diubah di {gradle}")
              print("Periksa konfigurasi compileSdk berikut:")
              for line in text.splitlines():
                  if "compileSdk" in line:
                      print(line.strip())

          print(f"File konfigurasi: {gradle}")
          PY

      # 10. Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # 11. Analyze source without failing on warnings
      - name: Analyze application source
        continue-on-error: true
        run: flutter analyze --no-pub lib/main.dart

      # 12. Build release APK
      - name: Build release APK
        id: build_apk
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build-release.log

      # 13. Show APK information
      - name: Show APK information
        if: success()
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"
          echo "=== APK BERHASIL DIBUAT ==="
          ls -lh "$APK"
          sha256sum "$APK"

      # 14. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # 15. Show error details
      - name: Show build failure details
        if: failure()
        run: |
          echo "========================================"
          echo "BUILD TAGIHIN GAGAL"
          echo "========================================"

          if [ -f build-release.log ]; then
            echo "=== RINGKASAN ERROR ==="
            grep -n -i -E \
              'error:|FAILURE:|What went wrong:|requires libraries|BUILD FAILED|Could not resolve|Could not find' \
              build-release.log | tail -n 80 || true

            echo "=== LOG TERAKHIR ==="
            tail -n 100 build-release.log
          else
            echo "Log build belum tersedia."
          fi
