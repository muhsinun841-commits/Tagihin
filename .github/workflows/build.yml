name: Build TAGIHIN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Mengambil kode dari GitHub
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Memasang Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Memasang Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Memeriksa file proyek
      - name: Check required files
        shell: bash
        run: |
          set -e

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart tidak ditemukan."
            exit 1
          fi

          echo "File utama ditemukan."
          flutter --version

      # 5. Membuat folder dan file proyek Android
      - name: Generate Android project files
        shell: bash
        run: |
          set -e

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Folder Android belum lengkap."
            flutter create \
              --platforms=android \
              --org com.tagihin \
              --project-name tagihin \
              .
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml belum terbentuk."
            exit 1
          fi

          echo "File AndroidManifest.xml ditemukan."

      # 6. Mengambil dependensi
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      # 7. Memeriksa versi SharedPreferences
      - name: Verify SharedPreferences Android version
        shell: bash
        run: |
          set -e

          echo "Memeriksa shared_preferences_android..."

          VERSION=$(dart pub deps --style=compact |
            grep -oE 'shared_preferences_android [0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 |
            awk '{print $2}' || true)

          if [ -z "$VERSION" ]; then
            echo "ERROR: shared_preferences_android tidak ditemukan."
            dart pub deps --style=compact
            exit 1
          fi

          echo "Versi shared_preferences_android: $VERSION"

          if [ "$VERSION" = "2.5.0" ]; then
            echo "ERROR: Versi 2.5.0 tidak diizinkan oleh pemeriksaan ini."
            exit 1
          fi

      # 8. Memeriksa ikon aplikasi
      - name: Check launcher icon
        shell: bash
        run: |
          set -e

          if [ ! -f assets/icon/tagihin.png ]; then
            echo "ERROR: assets/icon/tagihin.png tidak ditemukan."
            echo "Pastikan file ikon sudah diunggah ke repositori."
            exit 1
          fi

          echo "File ikon ditemukan."

      # 9. Membuat ikon Android
      - name: Generate Android launcher icon
        shell: bash
        run: |
          set -e

          dart run flutter_launcher_icons

          echo "Ikon aplikasi berhasil diproses."

      # 10. Memeriksa kode Dart
      - name: Analyze Flutter code
        shell: bash
        run: |
          set -e
          flutter analyze --no-pub

      # 11. Membuat APK release
      - name: Build release APK
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --no-pub

      # 12. Memastikan APK tersedia
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: File APK tidak ditemukan."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK berhasil dibuat."

      # 13. Mengunggah APK agar bisa diunduh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
