name: Build TAGIHIN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TAGIHIN APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Periksa lingkungan build
      - name: Check build environment
        shell: bash
        run: |
          set -e
          echo "===== JAVA ====="
          java -version
          echo "===== FLUTTER ====="
          flutter --version

      # 5. Periksa proyek dan buat folder Android jika belum ada
      - name: Check project and generate Android folder
        shell: bash
        run: |
          set -e

          echo "===== MEMERIKSA PROYEK TAGIHIN ====="

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            echo "Pastikan proyek Flutter berada di root repository."
            exit 1
          fi

          echo "===== FILE PROYEK ====="
          ls -la

          if [ ! -d android ]; then
            echo "Folder android belum tersedia."
            echo "Membuat konfigurasi Android..."

            flutter create \
              --platforms=android \
              --org com.tagihin \
              .

          else
            echo "Folder android sudah tersedia."
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: File Gradle aplikasi Android tidak ditemukan."
            find android -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Folder Android siap."
          ls -la android

      # 6. Install Android SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 7. Atur compileSdk aplikasi
      - name: Configure Android compileSdk
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          file = next((p for p in files if p.exists()), None)

          if file is None:
              raise SystemExit("ERROR: File Gradle aplikasi tidak ditemukan.")

          text = file.read_text()

          patterns = [
              (
                  r"(?m)^(\s*)compileSdkVersion\s+\d+",
                  r"\1compileSdkVersion 36",
              ),
              (
                  r"(?m)^(\s*)compileSdk\s*=\s*\d+",
                  r"\1compileSdk = 36",
              ),
              (
                  r"(?m)^(\s*)compileSdk\s+\d+",
                  r"\1compileSdk 36",
              ),
          ]

          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text)

          file.write_text(text)

          print(f"Konfigurasi diperiksa: {file}")

          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      # 8. Ambil dependensi Flutter
      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub-get.log

      # 9. Perbaiki compileSdk plugin file_picker
      - name: Fix file_picker Android compileSdk
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = []

          if cache.exists():
              for folder in cache.glob("file_picker-*"):
                  android = folder / "android"
                  files.extend(android.glob("build.gradle"))
                  files.extend(android.glob("build.gradle.kts"))

          if not files:
              raise SystemExit(
                  "ERROR: Gradle plugin file_picker tidak ditemukan."
              )

          for file in files:
              text = file.read_text()
              lines = text.splitlines(keepends=True)
              updated = []
              changed = False

              for line in lines:
                  stripped = line.strip()
                  indent = line[:len(line) - len(line.lstrip())]
                  ending = "\n" if line.endswith("\n") else ""

                  if re.match(r"compileSdkVersion\b", stripped):
                      updated.append(indent + "compileSdkVersion 36" + ending)
                      changed = True

                  elif re.match(r"compileSdk\s*=", stripped):
                      updated.append(indent + "compileSdk = 36" + ending)
                      changed = True

                  elif re.match(r"compileSdk\s+", stripped):
                      updated.append(indent + "compileSdk 36" + ending)
                      changed = True

                  else:
                      updated.append(line)

              if changed:
                  file.write_text("".join(updated))
                  print(f"Diperbaiki: {file}")
              else:
                  print(f"Tidak ada perubahan: {file}")

          # Periksa deklarasi compileSdk berbentuk angka.
          errors = []

          for file in files:
              for line in file.read_text().splitlines():
                  match = re.match(
                      r"^\s*compileSdk(?:Version)?\s*(?:=\s*)?(\d+)\b",
                      line,
                  )

                  if match and int(match.group(1)) < 36:
                      errors.append(f"{file}: {line.strip()}")

          if errors:
              for error in errors:
                  print("ERROR:", error)
              raise SystemExit(1)

          print("Pemeriksaan file_picker selesai.")
          PY

      # 10. Periksa konfigurasi Android
      - name: Check Android configuration
        shell: bash
        run: |
          echo "===== KONFIGURASI ANDROID ====="

          grep -R -n -E 'compileSdk|targetSdk|minSdk' \
            android 2>/dev/null || true

          echo "===== DEPENDENSI FILE_PICKER ====="
          flutter pub deps | grep -i -A 3 -B 2 file_picker || true

      # 11. Analisis kode
      - name: Analyze Flutter source
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      # 12. Build APK release
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build-release.log

      # 13. Periksa hasil APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find build -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "===== APK BERHASIL DIBUAT ====="
          ls -lh "$APK"
          sha256sum "$APK"

      # 14. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # 15. Tampilkan detail error
      - name: Show build failure details
        if: failure()
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD TAGIHIN GAGAL"
          echo "======================================"

          for LOG in pub-get.log analyze.log build-release.log; do
            if [ -f "$LOG" ]; then
              echo ""
              echo "===== ERROR DARI $LOG ====="

              grep -n -i -E -C 4 \
                'FAILURE:|What went wrong:|Execution failed|Could not resolve|Could not find|requires libraries|compileSdk|error:|Exception|BUILD FAILED|No matching variant|Unsupported class file|Permission denied|not found' \
                "$LOG" | tail -n 180 || true

              echo ""
              echo "===== 60 BARIS TERAKHIR ====="
              tail -n 60 "$LOG" || true
            fi
          done

          echo ""
          echo "===== STRUKTUR ANDROID ====="
          find android -maxdepth 4 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            -print 2>/dev/null || true

      # 16. Simpan log jika gagal
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-build-error-logs
          path: |
            pub-get.log
            analyze.log
            build-release.log
          if-no-files-found: ignore
          retention-days: 7
