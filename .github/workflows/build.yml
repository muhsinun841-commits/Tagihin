name: Build TAGIHIN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TAGIHIN APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Periksa lingkungan
      - name: Check build environment
        shell: bash
        run: |
          set -e
          java -version
          flutter --version

      # 5. Buat konfigurasi Android jika belum ada
      - name: Check project and generate Android
        shell: bash
        run: |
          set -e

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          if [ ! -d android ]; then
            flutter create --platforms=android --org com.tagihin .
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "Folder Android siap."

      # 6. Periksa file logo
      - name: Check Tagihin logo
        shell: bash
        run: |
          set -e

          if [ ! -f assets/icon/tagihin.png ]; then
            echo "ERROR: Logo tidak ditemukan."
            echo "Unggah logo ke assets/icon/tagihin.png."
            exit 1
          fi

          file assets/icon/tagihin.png

      # 7. Atur nama aplikasi
      - name: Set app name to Tagihin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          if re.search(r'android:label="[^"]*"', text):
              text = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="Tagihin"',
                  text,
                  count=1
              )
          else:
              text = re.sub(
                  r'<application\b',
                  '<application android:label="Tagihin"',
                  text,
                  count=1
              )

          manifest.write_text(text)
          print("Nama aplikasi diatur menjadi Tagihin.")
          PY

      # 8. Siapkan gambar ikon
      - name: Prepare Tagihin icon
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/icon/tagihin.png")

          if not source.exists():
              raise SystemExit("ERROR: Logo Tagihin tidak ditemukan.")

          image = Image.open(source).convert("RGBA")

          # Pertahankan seluruh logo di dalam gambar persegi.
          image.thumbnail((1024, 1024), Image.Resampling.LANCZOS)

          background = Image.new("RGBA", (1024, 1024), "white")

          x = (1024 - image.width) // 2
          y = (1024 - image.height) // 2

          background.alpha_composite(image, (x, y))

          background.convert("RGB").save(source, "PNG")

          print("Logo berhasil disiapkan.")
          PY

      # 9. Buat ikon launcher Android
      - name: Generate Tagihin launcher icon
        shell: bash
        run: |
          set -e

          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/tagihin.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/icon/tagihin.png"
          EOF

          dart run flutter_launcher_icons

          echo "===== IKON ANDROID ====="
          find android/app/src/main/res \
            -type f -name "*launcher*" -print

      # 10. Pasang Android SDK 36
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 11. Atur compileSdk aplikasi
      - name: Configure Android compileSdk
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle is None:
              raise SystemExit(
                  "ERROR: File Gradle aplikasi tidak ditemukan."
              )

          text = gradle.read_text()

          patterns = [
              (
                  r"(?m)^(\s*)compileSdkVersion\s+\d+",
                  r"\1compileSdkVersion 36",
              ),
              (
                  r"(?m)^(\s*)compileSdk\s*=\s*\d+",
                  r"\1compileSdk = 36",
              ),
              (
                  r"(?m)^(\s*)compileSdk\s+\d+",
                  r"\1compileSdk 36",
              ),
          ]

          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text)

          gradle.write_text(text)

          print(f"Konfigurasi diperiksa: {gradle}")

          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      # 12. Ambil dependensi Flutter
      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub-get.log

      # 13. Perbaiki compileSdk file_picker
      - name: Fix file_picker compileSdk
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = (
              Path.home()
              / ".pub-cache"
              / "hosted"
              / "pub.dev"
          )

          files = []

          if cache.exists():
              for folder in cache.glob("file_picker-*"):
                  android = folder / "android"
                  files.extend(android.glob("build.gradle"))
                  files.extend(android.glob("build.gradle.kts"))

          if not files:
              print("PERINGATAN: File Gradle file_picker tidak ditemukan.")
              raise SystemExit(0)

          for file in files:
              original = file.read_text()
              updated = []

              for line in original.splitlines(keepends=True):
                  stripped = line.strip()
                  indent = line[:len(line) - len(line.lstrip())]
                  ending = "\n" if line.endswith("\n") else ""

                  if re.match(r"compileSdkVersion\b", stripped):
                      updated.append(
                          indent + "compileSdkVersion 36" + ending
                      )
                  elif re.match(r"compileSdk\s*=", stripped):
                      updated.append(
                          indent + "compileSdk = 36" + ending
                      )
                  elif re.match(r"compileSdk\s+", stripped):
                      updated.append(
                          indent + "compileSdk 36" + ending
                      )
                  else:
                      updated.append(line)

              file.write_text("".join(updated))
              print(f"Diperiksa: {file}")
          PY

      # 14. Periksa ikon dan nama sebelum build
      - name: Verify Tagihin branding
        shell: bash
        run: |
          set -e

          echo "===== NAMA APLIKASI ====="
          grep -n 'android:label' \
            android/app/src/main/AndroidManifest.xml || true

          echo "===== IKON YANG TERSEDIA ====="
          find android/app/src/main/res \
            -type f -name "*launcher*" -print

          if ! find android/app/src/main/res \
            -type f -name "*launcher*" | grep -q .; then
            echo "ERROR: File ikon launcher tidak ditemukan."
            exit 1
          fi

      # 15. Analisis kode
      - name: Analyze Flutter source
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      # 16. Build APK release
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose \
            2>&1 | tee build-release.log

      # 17. Verifikasi APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find build -type f -name "*.apk" || true
            exit 1
          fi

          echo "===== TAGIHIN APK BERHASIL ====="
          ls -lh "$APK"
          sha256sum "$APK"

      # 18. Upload APK
      - name: Upload TAGIHIN APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # 19. Tampilkan error build
      - name: Show build failure details
        if: failure()
        shell: bash
        run: |
          echo "================================"
          echo "BUILD TAGIHIN GAGAL"
          echo "================================"

          for LOG in pub-get.log analyze.log build-release.log; do
            if [ -f "$LOG" ]; then
              echo ""
              echo "===== $LOG ====="

              grep -n -i -E -C 4 \
                'FAILURE:|What went wrong:|Execution failed|Could not resolve|Could not find|requires libraries|compileSdk|error:|Exception|BUILD FAILED|not found' \
                "$LOG" | tail -n 160 || true

              echo ""
              tail -n 50 "$LOG" || true
            fi
          done

      # 20. Simpan log jika gagal
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-error-logs
          path: |
            pub-get.log
            analyze.log
            build-release.log
          if-no-files-found: ignore
          retention-days: 7
