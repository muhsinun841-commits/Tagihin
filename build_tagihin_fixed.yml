name: Build TAGIHIN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check project files
        run: |
          test -f pubspec.yaml || { echo 'ERROR: pubspec.yaml tidak ditemukan di root repository.'; exit 1; }
          test -f lib/main.dart || { echo 'ERROR: lib/main.dart tidak ditemukan.'; exit 1; }

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.tagihin.app
          fi

      - name: Set Android app label
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="TAGIHIN"/' "$MANIFEST"
          else
            echo 'ERROR: AndroidManifest.xml tidak ditemukan setelah menyiapkan platform Android.'
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application source
        # Warning/info tidak menghentikan build; error Dart tetap membuat langkah ini gagal.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK information
        if: success()
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAGIHIN-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
