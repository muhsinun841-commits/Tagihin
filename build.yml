name: Build TAGIHIN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required files
        shell: bash
        run: |
          test -f pubspec.yaml || { echo 'ERROR: pubspec.yaml tidak ditemukan'; exit 1; }
          test -f lib/main.dart || { echo 'ERROR: lib/main.dart tidak ditemukan. Simpan kode aplikasi di lib/main.dart'; exit 1; }
          test -f assets/icon/tagihin.png || { echo 'ERROR: assets/icon/tagihin.png tidak ditemukan. Tambahkan gambar ikon PNG 512x512 ke lokasi ini.'; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Verify SharedPreferences Android version
        shell: bash
        run: |
          flutter pub deps | grep shared_preferences_android
          if grep -A 2 '^  shared_preferences_android:' pubspec.lock | grep -q 'version: "2.5.0"'; then
            echo 'ERROR: shared_preferences_android 2.5.0 terpilih, versi ini perlu dihindari.'
            exit 1
          fi

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tagihin-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
